[pytest]
; This machine has ROS installed globally, which registers pytest plugins
; (launch_testing, ament_*, launch_ros) via entry points. Pytest autoloads
; them even inside this repo's venv, and importing them fails here (missing
; `yaml`) since this venv is intentionally isolated from ROS. Disabling them
; is scoped to this repo only -- it does not touch the ROS installation or
; any other project.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_xmllint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_lint
